[project]
name = "pideinfo-agent"
version = "0.9.0"
description = "PideInfo Agent — Syncs Portal de Transparencia with PideInfo"
requires-python = ">=3.11"
dependencies = [
    # Pinned: each Playwright release maps to one Firefox build; see requirements.txt
    "playwright==1.60.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12",
    "truststore>=0.9",
    "keyring>=25.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "packaging>=24.0",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core>=9.2",
    "pyobjc-framework-Cocoa>=9.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pideinfo-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
